name: Biped application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r portfolio/requirements.lock
      - run: ruff check portfolio
      - run: python -m pytest portfolio -q
      - run: python -m portfolio.biped --output /tmp/biped-results
